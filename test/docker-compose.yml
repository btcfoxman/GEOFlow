name: geoflow-test

x-app-base: &app-base
  image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-btcfoxman}/geoflow-app:${IMAGE_TAG:-test-latest}
  working_dir: /var/www/html
  environment:
    # The init container owns schema/install mutations. Long-running services
    # must not race each other during startup.
    AUTO_MIGRATE: "false"
    AUTO_INSTALL_ONCE: "false"
  volumes:
    - ./.env:/var/www/html/.env
    - ./storage:/var/www/html/storage
  networks:
    - shared
  restart: unless-stopped

services:
  init:
    <<: *app-base
    container_name: geoflow-test-init
    env_file:
      - ./.env
    environment:
      AUTO_MIGRATE: "true"
      AUTO_INSTALL_ONCE: "true"
    command: ["php", "artisan", "about"]
    restart: "no"

  app:
    <<: *app-base
    container_name: geoflow-test-app
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-btcfoxman}/geoflow-web:${IMAGE_TAG:-test-latest}
    container_name: geoflow-test-web
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - ./storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - shared
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  queue:
    <<: *app-base
    container_name: geoflow-test-queue
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,theme-replication,default", "--sleep=1", "--tries=1", "--timeout=300"]
    depends_on:
      init:
        condition: service_completed_successfully

  scheduler:
    <<: *app-base
    container_name: geoflow-test-scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      init:
        condition: service_completed_successfully

  reverb:
    <<: *app-base
    container_name: geoflow-test-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:${REVERB_SERVER_PORT:-18080}"
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-my-shared-net}
