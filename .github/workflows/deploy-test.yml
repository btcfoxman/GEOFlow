name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: geoflow-test
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_TAG_LATEST: test-latest

jobs:
  test:
    name: Run contract tests
    runs-on: ubuntu-latest
    env:
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      BROADCAST_CONNECTION: 'null'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run tests
        run: php artisan test

  build:
    name: Build images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: geoflow-app
            dockerfile: docker/Dockerfile.prod
          - name: geoflow-web
            dockerfile: docker/nginx/Dockerfile.prod
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          echo "image=${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.name }}" >> "${GITHUB_OUTPUT}"
          echo "image_sha_tag=test-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG_LATEST }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_sha_tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          sbom: false

  deploy:
    name: Deploy to 192.168.3.6
    needs: build
    environment: test
    runs-on:
      - self-hosted
      - linux
      - aitoearn-test
    env:
      APP_DIR: /home/btcfoxman/docker/geoflow
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      IMAGE_TAG: test-latest
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - name: Fetch deployment files
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          work_dir="${RUNNER_TEMP:-/tmp}/${repo_name}-repo-${GITHUB_RUN_ID}"
          rm -rf "${work_dir}"
          mkdir -p "${work_dir}"

          auth_config="${work_dir}/.curl-auth"
          {
            printf 'header = "Authorization: Bearer %s"\n' "${CHECKOUT_TOKEN}"
            printf 'header = "Accept: application/vnd.github.raw"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "${auth_config}"
          chmod 600 "${auth_config}"

          download_file() {
            local path="$1"
            mkdir -p "${work_dir}/$(dirname "${path}")"
            curl --config "${auth_config}" \
              --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 120 \
              -o "${work_dir}/${path}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}"
          }

          for file in test/deploy.sh test/docker-compose.yml test/.env.example
          do
            download_file "${file}"
          done

          rm -f "${auth_config}"
          chmod +x "${work_dir}/test/deploy.sh"
          echo "REPO_WORK_DIR=${work_dir}" >> "${GITHUB_ENV}"

      - name: Deploy
        env:
          GEOFLOW_ENV_FILE_B64: ${{ secrets.GEOFLOW_ENV_FILE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${APP_DIR}"
          if [ -z "${GEOFLOW_ENV_FILE_B64}" ]; then
            echo "Missing required GEOFlow test secret: GEOFLOW_ENV_FILE_B64" >&2
            exit 1
          fi

          env_temp="${APP_DIR}/.env.tmp.${GITHUB_RUN_ID}"
          umask 077
          printf '%s' "${GEOFLOW_ENV_FILE_B64}" | base64 --decode > "${env_temp}"
          unset GEOFLOW_ENV_FILE_B64

          for required_key in APP_KEY GEOFLOW_ADMIN_PASSWORD DB_PASSWORD REDIS_PASSWORD REVERB_APP_KEY REVERB_APP_SECRET; do
            if ! grep -Eq "^${required_key}=.+" "${env_temp}"; then
              echo "Decoded GEOFlow environment is missing ${required_key}" >&2
              rm -f "${env_temp}"
              exit 1
            fi
          done
          chmod 600 "${env_temp}"
          mv -f "${env_temp}" "${APP_DIR}/.env"

          cd "${REPO_WORK_DIR}"
          bash test/deploy.sh
